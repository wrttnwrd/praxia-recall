# ── Lumpkin's Meats: promoted from the coverage pass to a real place ──
# The coverage pass filed it as generic `lore/reference` because its source file
# is a single untyped paragraph. It is a shop.
- id: lumpkin-s-meats
  kind: places
  type: poi
  title: Lumpkin's Meats
  description: The old butcher shop, run by Lumpkin's family for generations; supplies most of the meat for the palace and the military.
  aka: []
  relations:
    owned_by: [lumpkin]
    located_in: [hull-ward]
    ally_of: [lumpkins-fine-foods]
  evidence:
    owned_by: "'His family has run the old butcher shop for generations.' Named as Lumpkin's in the Aventine sourcebook's Docks section."
    located_in: "User correction: Lumpkin's Meats adjoins Lumpkin's Fine Foods, which is in Hull Ward. NOTE — the Aventine sourcebook lists Lumpkin's Meats under '### The Docks', so the source places the two shops in different districts. The user's placement is used here."
    ally_of: "User: 'It adjoins Lumpkin's Fine Foods and is also owned by Lumpkin.'"
  confidence: stated
  body: |
    He's a welcoming soul, popular and friendly to all. He gets his supplies
    directly from the keelboats and traders, thereby ensuring he's got the best
    stuff available. His family has run the old butcher shop for generations.

    The shop is clean, with sawdust on the floor. The help — when they're not at
    Lumpkin's Fine Foods — are two glum-looking halflings: Lumpkin's nephews
    Turbin and Heribert, sent to the city to learn a trade. Tasty meats and
    jerky, plus salted pork, hang in the window; in the back hang large slabs of
    beef, mutton and pork. The front has racks of spices, tools and prepared
    meats like hard tack, and the back has a large door where carts and wagons
    can pull up.

    He does a brisk business with sailing ships, and supplies most of the meat
    for the palace and the military.

    The Lumpkin family has a secret: a wand of Detect Disease and Poison they use
    daily to test cuts of meat. Where rotten product is a huge problem for most
    shops, it isn't for them, and hasn't been since the store opened.

- id: lumpkins-fine-foods
