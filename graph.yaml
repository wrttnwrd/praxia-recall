- id: court-of-aventine
  kind: groups
  type: organization
  title: The Court Of Aventine
  description: The Azari court — Feyd, his wives and children, and his spymaster.
  source: _sourcebooks/organizations/Court Of Aventine.md
  relations:
    based_in: [aventine]
    has_member: [feyd-azari, aisha-azari, fidelia-azari, siliib-azari, xavis]
    ally_of: [order-of-helm]
  confidence: stated

- id: feyd-azari
  description: Merchant prince of Aventine; a hands-off leader in his 40s who rules through the houses.
  body: |
    A classic behind-the-scenes leader who has kept Aventine a vibrant, growing
    city even in the years following the Fall. Handsome, dark-haired, in his 40s.
    He took over after his father died, is intensely loyal to family and to those
    who have aided him, and is well-liked by the houses but little-known to the
    city at large — he prefers to entrust the day-to-day running of Aventine to
    the houses, whom he manages and keeps under control.

    *The more you tell people what to do, the less they can decide for themselves.
    Instead, tell them what you want and let them figure it out.*
  relations: {member_of: [court-of-aventine], family_of: [fatimah-azari]}
  confidence: stated

- id: aisha-azari
  description: Feyd's second wife; intellectual, descended from the former rulers of Salmuir, teaches part-time at the University.
  body: |
    Mid-30s. She and Feyd love each other passionately. She dotes on her son
    Siliib but has learned to provide a firmer hand, and wishes she could be
    closer to Fidelia. Descended from the former rulers of Salmuir, she would
    prefer to stay out of the limelight: very intellectual, deeply studied in the
    religions and history of Praxia, and a part-time teacher at the University.
  relations: {member_of: [court-of-aventine], works_at: [university-of-aventine]}
  confidence: stated

- id: fidelia-azari
  description: Feyd's eldest, groomed for leadership; her mother Fatimah died in the plague of -5 FR when Fidelia was five.
  body: |
    Late teens to early twenties. Smart as hell — she studied finance, trade,
    weather and some magic (knowledge, not ability). Dark, tall, always composed
    and charismatic, and groomed for leadership of the city. Somewhat cool
    towards her half-brother and stepmother. Very serious, rarely smiles; she can
    sink an argument with a single raised eyebrow.

    *I do have an opinion, yes. I thought I'd wait for you to finish babbling
    before I provided it.*
  relations: {member_of: [court-of-aventine], family_of: [fatimah-azari], ally_of: [gallias]}
  evidence:
    family_of: "'Her mother, Fatimah, died during the plague of -5 FR, when Fatima was only five'"
  confidence: stated

- id: fatimah-azari
  kind: people
  type: npc
  title: Fatimah Azari
  description: Feyd's first wife and Fidelia's mother; died in the plague of -5 FR.
  relations: {family_of: [feyd-azari, fidelia-azari]}
  as_of: "-5 FR (died)"
  confidence: stated

- id: gallias
  kind: people
  type: npc
  title: Gallias
  description: Fey Eladrin, Summer since breaking with his parents; married Fidelia Azari at Midsummer 07.
  aka: [Gallius]
  relations: {ally_of: [fidelia-azari], family_of: [cetranah, veles], participated_in: [a-midsummer-wedding]}
  body: |
    Sober, talkative, quick to anger against those who slight him or his loved
    ones. Appears to be in his early twenties. Rail-thin, wiry, 6'5", always
    carrying a hooked orange blade — a +1 Flametongue — and wearing rich red
    brocade with gold stitching visible only in certain light. He loves Fidelia
    fiercely and is sensitive about the fact that she's human. His eyes flash
    orange when he is emotional.

    He changed from a Spring to a Summer Eladrin after breaking with his parents
    over the engagement.
  evidence:
    family_of: "'Cetranah and Veles have broken with their son, Gallias, over his engagement to Fidelia Azari.'"
  confidence: stated

- id: cetranah
  kind: people
  type: npc
  title: Cetranah
  description: Duchess of the Summer Court; Gallias's mother, who retained Diskuss to break the engagement.
  relations: {family_of: [gallias, veles], participated_in: [a-midsummer-wedding]}
  confidence: stated

- id: veles
  kind: people
  type: npc
  title: Veles
  description: Duke of the Summer Court; Gallias's father.
  relations: {family_of: [gallias, cetranah], participated_in: [a-midsummer-wedding]}
  confidence: stated

- id: diskuss
  kind: people
  type: npc
  title: Diskuss
  description: Jester of the Gloaming Court, disguised as a gnome waiter, who enchanted Fidelia at the wedding.
  relations: {serves: [cetranah, veles], participated_in: [a-midsummer-wedding]}
  confidence: stated

- id: siliib-azari
  description: Feyd's son by Aisha; mid-teens, maturing out of a pampered start into a conscientious young man.
  body: |
    Mid-teens. Pampered and spoiled early on, Siliib is maturing into a
    conscientious, caring young man. Adventurous to the point of recklessness —
    no one can doubt his courage. Sensitive, empathic and very good at judging
    others. He talks too much at social events and tends to overindulge in wine
    there; it's anxiety.
  relations: {member_of: [court-of-aventine]}
  confidence: stated

- id: xavis
