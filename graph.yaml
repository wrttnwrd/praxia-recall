- id: rikterr
  kind: people
  type: pc
  title: Rikterr
  description: Paladin of the Raven Queen; orphan of Salmuir; sacrificed himself at the fall of the chain in 027.
  species: human
  relations:
    member_of: [notorious-rbg]
    serves: [the-raven-queen]
    mentored_by: [alphonse-horn]
    family_of: [gerudo-durtbourne, schala-zeal]
    ally_of: [mossy]
    enemy_of: [thargorax, agrona-sef]
    participated_in: [ambush-at-mistwharf, the-fall-of-the-chain]
  evidence:
    mentored_by: "'right before he jumped, a paladin named Alphonse Horn stopped him. In exchange for saving his life, Horn made Rikterr pledge it in service to others.'"
    family_of: "'Childhood best friends: Ger'u'do Durtbourne, a half-orc, and Schala Zeal, a half-elf'"
    ally_of: "'Bruised, cut, and partly fried, Rikterr fixed Mossy with a steady gaze, said, \"I love you\"' (session 023)"
  body: |
    Paladin of the Raven Queen. An orphan, he grew up destitute in Salmuir with
    his only friends: Ger'u'do Durtbourne, a half-orc, and Schala Zeal, a half-elf.
    Both he and Ger'u'do loved Schala. One night Rikterr got drunk, let his
    jealousy rage, and beat Ger'u'do nearly to death. The next day he went looking
    for a cliff to jump from, and the paladin Alphonse Horn stopped him — taking,
    in exchange, his pledge to serve others.

    He did not take a god before the Raven Queen because he never felt worthy.
    His training did not remove his rage; it let him use it.

    At the ambush at Mistwharf he told Mossy he loved her and triggered the
    sacrifice power of The Light That Sparks, dying and coming within 15hp of
    permanent death before being revivified. He has since resolved to break his
    Oath of Devotion for an Oath of Vengeance. He promised the Temple of Helm the
    Quinary would be returned. He was sacrificed at the fall of the chain.
  confidence: stated

- id: mossy
  kind: people
  type: pc
  title: Mossy
  description: Tabaxi thief of Salmuir, searching for her lost friend Twig; the Trickster Tabaxi whose theft set Agrona Sef hunting.
  species: tabaxi
  relations:
    member_of: [notorious-rbg]
    ally_of: [rikterr]
    enemy_of: [agrona-sef, thargorax]
    seeks: [twig]
    holds: [the-seals]
    participated_in: [ambush-at-mistwharf]
  evidence:
    seeks: "'Looking for Twig - best friend from Salmuir. May be on a ship - Cregyn heard about a Tabaxi on the Bluestrike merchant vessel Snapjaw.'"
    holds: "'They know that Mossy has the seals.' (session 023)"
    enemy_of: "Agrona's Legend Lore returned 'A Trickster Tabaxi Lit A Fire In My Bones' and she killed Elissa Bournier to find Mossy (session 003)."
  body: |
    A Tabaxi thief from Salmuir. She carries the Seals and wields the Eye That
    Sees, with which she caught Rave The Howler invisible and preparing an ambush.

    She is looking for Twig, her best friend from Salmuir, who may be aboard the
    Bluestrike merchant vessel *Snapjaw*.

    Under Essie Darksinger's tarot trial her secret was: "I let another Tabaxi
    take the fall and get killed for one of her crimes."
  confidence: stated

- id: drak
  kind: people
  type: pc
  title: Drak
  description: Ranger sworn to a goddess of vengeance, moving from revenge-as-anger toward vengeance-as-justice.
  relations:
    member_of: [notorious-rbg]
    enemy_of: [thargorax, agrona-sef, sea-gristle]
    former_member_of: [elidans-crew]
    participated_in: [ambush-at-mistwharf]
  evidence:
    former_member_of: "Drak's secret at Bedlam's Faire: 'I loved the power I felt running with Elidan's crew' (session 025)"
  body: |
    A ranger who left his tribe. His arc runs from revenge as a selfish act of
    anger toward vengeance as a form of justice and protection for others; he
    serves a petty goddess of vengeance and is uneasy about whether her vengeance
    and his are the same thing. He is considering the Silverscale Clan as a
    possible new tribe, and uses his pub as a place to find people who need help.

    At Bedlam's Faire his secret was: "I loved the power I felt running with
    Elidan's crew."
  confidence: stated

- id: cregyn
  kind: people
  type: pc
  title: Cregyn
  description: Tortle of Notorious RBG; has only five years to live because of the Voice That Calls.
  species: tortle
  relations:
