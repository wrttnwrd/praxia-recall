# 2. Elissa Bournier: the body's 'Status: Alive' was stale template text.
- id: elissa-bournier
  evidence:
    killed_by: "Author: 'Elissa Bournier is very much dead, murdered by Agrona Sef.' The body's template line 'Status: Alive' is stale; the frontmatter `status: dead` and session 003 are correct. RESOLVED."
    as_of: "Killed by Agrona Sef on 27 Stormclaw 07, who tortured her for what she knew of Mossy and then trapped her soul with Soul Cage."

# 3. Veda names both a First God and a seal — not a conflict.
- id: the-seals
  evidence:
    founded_by: "Author: 'Veda is both the name of a seal and the name of a god.' So the Arcane seal being labelled Veda is not an error and does not conflict with Veda the First God of divinity. RESOLVED."
  body: |
    **Chaos — Flux.** Was at East Godelis; removed by RBG. Long exposure leads to
    chaotic behaviour.

    **Life — Lida.** Near the Gloomspire in the Underdark. Long exposure causes
    de-aging, uneven growth, or aging and necrotic loss. Recorded in the source
    as destroyed by Thargorax.

    **Divine.** On the Field of Bones, Essedria.

    **Arcane — Veda.** Was near Porth Môr; destroyed by Agrona Sef — the break
    that severed the ley line, hid Selune's stars, and disrupted elemental magic.

    Note that *Veda* names both one of the First Gods and one of the Seals; the
    two uses are distinct and neither is a mistake.

    A being can **bind** with each Seal, passing beyond this existence and
    carrying them back to the First Gods. The ritual takes two days, requires a
    being with the constitution to survive it, and the being need not be willing.
    Knowledge of it sits in three places: deep within the Temple of Helm, in a
    document at House Umbra, and hidden in the writings of the Tome of the First
    Gods.

