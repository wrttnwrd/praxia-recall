- id: the-brand
  kind: things
  type: arcana
  title: The Fivefold Brand
  description: Tiamat's curse on Notorious RBG — a five-pointed brand in red, green, white, blue and black, marking them as her banner.
  source: _stories/RBG/The Five Fold Brand/Tiamat's revenge.md
  relations: {founded_by: [tiamat], held_by: [notorious-rbg]}
  evidence:
    founded_by: "'Unbeknownst to the players, Tiamat cursed them. They bear the Five Fold Brand... You feel a searing heat on your skin as a five-pointed brand appears on your dream-self. Five colors: Red. Green. White. Blue. Black.'"
  confidence: stated
  body: |
    > **You thought you won?! Mortal idiots. All of you. Before, I planned simply
    > to escape my prison. Now, I shall carve my likeness upon the very rock of
    > your world. My armies will raze Praxia from pole to pole. And you? You shall
    > be my banner.** You should have killed me when you had the chance.

    The curse slowly separates the party from those they love most, while they
    serve as unwitting messiahs for Tiamat's return. Damage alone cannot kill
    her — she is not native to Avernus, so dying there will not erase her. Only
    the **Dagger Of Amoth**, the blade used to slay Amoth, will do it.

