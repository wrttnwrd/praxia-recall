- id: notorious-rbg
  kind: groups
  type: party
  title: Notorious RBG
  description: The adventuring party — the Pentar Virones — the only ones who can open the Stygian Gate with the Quinary.
  source: _sourcebooks/RBG/Notorious RBG.md
  aka: [Pentar Virones, RBG]
  relations:
    has_member: [rikterr, mossy, drak, cregyn, sango]
    based_in: [the-green-slaad]
    owns: [the-villains-discontent, wyldwood]
    enemy_of: [thargorax, agrona-sef, gritch]
    ally_of: [iric, kaelen-varrus, blong-hrusto, roxlycheh, the-wave-serpent]
    holds: [the-quinary, the-seals]
    participated_in: [ambush-at-mistwharf, the-fall-of-the-chain]
  evidence:
    has_member: "`characters: Drak, Mossy, Cregyn, Rikterr, Sango` across 66 sessions with `party: Notorious RBG`."
    based_in: "Referenced in 12 story files; the party is repeatedly summoned to the bar, and Thargorax lists 'the Green Slaad' among the places she would destroy to coerce them."
    owns: "'Their airship' — the party crews and travels aboard the Villain's Discontent throughout; 'Notorious RBG's bar at Wyldwood'."
    aka: "'Thargorax wants the Pentar Virones (RBG). Only they, with Quinary, can open the Stygian Gate wide enough to let her through.'"
  body: |
    The source page for the party reads, in its entirety: "Adventuring party."
    Everything else here was assembled from sixty-six session records and the
    campaign's lore documents.

