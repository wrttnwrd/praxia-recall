# ── The Seals and Quinary, corrected ──
- id: the-seals
  description: Four seals woven by Mist along the Ley Line, holding chaos, arcanum, naturum and divinity in balance and keeping the planes apart.
  source: _sourcebooks/arcana/The Seals.md
  relations: {founded_by: [mist], part_of: [the-ley-line]}
  evidence:
    founded_by: "Chaos/Flux — East Godelis, removed by RBG. Life/Lida — near the Gloomspire, destroyed. Divine — Field of Bones. Arcane — near Porthmoor, destroyed by Agrona Sef."
  as_of: "07 Flowering 07 — two seals in lead boxes with RBG; Arcane destroyed; Life destroyed"
  confidence: stated
  body: |
    **Chaos — Flux.** Was at East Godelis; removed by RBG. Long exposure leads to
    chaotic behaviour.

    **Life — Lida.** Near the Gloomspire in the Underdark. Long exposure causes
    de-aging, uneven growth, or aging and necrotic loss. Recorded in the source
    as destroyed by Thargorax.

    **Divine.** On the Field of Bones, Essedria.

    **Arcane.** Was near Porthmoor; destroyed by Agrona Sef — the break that
    severed the ley line, hid Selune's stars, and disrupted elemental magic.

    A being can **bind** with each Seal, passing beyond this existence and
    carrying them back to the First Gods. The ritual takes two days, requires a
    being with the constitution to survive it, and the being need not be willing.
    Knowledge of it sits in three places: deep within the Temple of Helm, in a
    document at House Umbra, and hidden in the writings of the Tome of the First
    Gods.

    > **Source conflict.** `The Seals.md` labels the Arcane seal "Veda", but the
    > Tome gives Veda as faith/divinity and Mist as magic/arcanum. By the Tome,
