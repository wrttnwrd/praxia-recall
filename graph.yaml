# ══════════ Session descriptions recovered from Otter transcripts ══════════
# These sessions have no `## Recap` in the vault. Descriptions below are drawn
# from the matching Otter recording's summary, PLAY CONTENT ONLY — table talk,
# rules debate and real-life conversation are excluded by rule.
# Matched on date (session title date and frontmatter date both checked).

- id: 034-01-20-2025-rbg
  description: Investigating the murder of a Haddad found drained of blood in his own quarters — no wounds, no forced entry, and a scrying sphere showing someone had been watching. Library research on the Shadowfell, dread domains and Nosferatu.
  confidence: stated
  evidence: {description: "Otter recording 2025/01/20 (2h46m), id BdgNgVgI41BEL9BN43b2UTRH168."}

- id: 037-03-31-2025-rbg
  description: Infiltrating a stash house in Shadowmuir. Rikterr and Ger'u'do went to the Temple of the Raven Queen for guidance on eliminating Kozani Noctis; Kiki guided the party through the wards, past a cobalt alchemist and a room suspected to be a drug lab, before they burned two buildings to send a message.
  confidence: stated
  evidence: {description: "Otter recording 2025/03/31 (2h3m), id fZVQQG7DGB7xs2MlhffLK2udhXs."}

- id: 039-05-26-2025-rbg
  description: The party negotiated a truce with Kozani Noctis rather than killing her — granting her a seat on the council of Salmuir on condition she abide by its rulings and forgo arcane and divine means.
  confidence: stated
  evidence: {description: "Otter recording 2025/05/26 (2h53m), id CewDTSgIy_fgMk37OG-mgr6Ntwk."}

- id: 043-07-21-2025-rbg
  description: Learning of Surtur, a demigod with a grudge against Tiamat, and of what it takes to survive Avernus. The party bought potions, paid Ember Forge thirty gold each way for passage to Wrathskald, and took amulets of comfort from Sierra Crest against the heat.
  confidence: stated
  evidence: {description: "Otter recording 2025/07/21 (2h53m), id 10B2XO70on0qY8ifas4zzK_1Jwc. NOTE: two session files carry this date (009 and 010); the recording is assigned to 009."}

- id: 052-01-05-2026-rbg
  description: Outfitting for Avernus — a portable magical hut, rings of fire resistance discounted by Artemis Hasp, holy water grenades, and a scroll of heroes' feast from Bartholemew for 7,500 gold against first refusal on any books found. Planning the route down the Helgoril to the River Styx.
  confidence: stated
  evidence: {description: "Otter recording 2026/01/05 (3h2m), id iKlQ1Tn9odTI66_OLYQcwHA6_r8."}

- id: 053-01-26-2026-rbg
  description: Avoiding the direct route for fear of ambush by Tiamat's minions. A red dragon sighted on a small island was outrun by pushing the airship's speed — which cost the party their long rests — and night watches were set.
  confidence: stated
  evidence: {description: "Otter recording 2026/01/26 (3h3m), id -Sy1CIFEfKWPh01IlBwenXeB5fo."}

- id: 055-03-16-2026-rbg
  description: "Arrival at Silgorin on the Styx — a city carved from bedrock and strung with bridges. Hiring a ferryman for the Dock of Fallen Cities: Voleth of the Fog would take them for two soul coins, or for a theft from the necromancer Obaris."
  confidence: stated
  evidence: {description: "Otter recording 2026/03/16 (2h27m), id aUvgS40Z2naxbN_VkrVCDUM1xjw."}

- id: 056-05-11-2026-rbg
  description: The Silence of Amoth, played as a one-shot with different characters — Black Helms sent quietly into the Temple of Amoth after three murders in three nights. Blood on the Hand of Amoth led to High Hierophant Varon, who had silenced his own followers to hear his dying god's last words. Then the impact, the crater, and the temple left perched on the rim.
  confidence: stated
  relations: {about: [the-silence-of-amoth, silgorin, amoth], part_of: [the-fivefold-brand]}
  evidence: {description: "Otter recording 2026/05/11 (2h58m), id OnvWZiftfOHSWN39eEq4sCiUnxI. Confirms the written one-shot; the transcript names the hierophant Varon where the document has Veyrin Toldain."}

- id: 057-05-25-2026-rbg
  description: Silgorin, now suspended over Avernus. The party killed two Cassime demons in a running fight between demons and devils, then agreed to escort survivors to an armoury for a bounty from a Black Helms commander, skirting a soul auction where four soul coins sold for 10,000 gold.
  confidence: stated
  evidence: {description: "Otter recording 2026/05/25 (1h56m), id uQUn_VSZ_pMG_tvw56QhwMex6JI."}

- id: 058-06-22-2026-rbg
  description: Leading civilians out through the besieged city under new mass-movement rules — the party taking the roles of Scout, Vanguard, Shepherd and Rear Guard, with morale checks each stage. A collapsing building was met with Wind Wall, and the party chose to save the city before continuing their own mission.
  confidence: stated
