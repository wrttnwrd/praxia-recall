  body: |
    Amoth had been dying for weeks — slowly, in the way a vast god dies — and the
    only mortal close enough to feel it was **High Hierophant Veyrin Toldain**,
    the most senior cleric of the Temple of Amoth. What he heard in his god's
    voice was grief, then panic, then a thinning silence, and it drove him mad.
    Believing his fellow clerics were drowning out Amoth's last words with their
    rote piety, he beat three of them to death with the ceremonial maul of the
    order, the Hand of Amoth.

    Only the Temple and a few buildings on the highest bluff survived, left on
    the rim of a crater opening onto the Nine Hells. The Helgoril, its springs
    gone, reversed and began pouring east-to-west into it. That crater is the
    Gurges; the surviving rim is the founding of Silgorin.

